  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#070707"); tg.setBackgroundColor("#070707"); } catch(e){} }
    CXAuth.ready(async () => {
      const el = document.getElementById("userBalance");
      try {
        const data = await CXAuth.fetchAccount();
        const n = Number((data.account || {}).balance_ton) || 0;
        el.textContent = n.toFixed(2);
        el.style.color = "#d4af37";
      } catch (err) {
        el.textContent = "ERR";
        el.style.color = "#ff4d4d";
        const box = document.createElement("div");
        box.style.cssText = "margin:12px;padding:10px;background:#2a1010;color:#ffb4b4;border-radius:10px;font-size:12px;word-break:break-all";
        box.textContent = String(err.message || err);
        document.querySelector(".cx-app").prepend(box);
      }
    });
  </script>
